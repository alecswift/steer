services:
  db:
    image: postgis/postgis:18-3.6
    # The official image is amd64-only; Apple Silicon runs it under emulation.
    platform: linux/amd64
    # Dev-only credentials; they match Phoenix's generated dev/test config.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    # Postgres 18+ images keep data in a versioned subdirectory, so the
    # volume mounts the parent (not /var/lib/postgresql/data).
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Routing engine. Only Phoenix calls it (FR-012).
  brouter:
    # Built from the upstream v1.7.10 release: ghcr.io only publishes
    # images up to v1.7.8, which can't read today's segment files
    # (lookup version 11).
    build: https://github.com/abrensch/brouter.git#v1.7.10
    image: steer-brouter:v1.7.10
    ports:
      - "127.0.0.1:17777:17777"
    volumes:
      - brouter-segments:/segments4

  # One-shot download of BRouter's segment files (the whole world, about
  # 10 GB) into the brouter-segments volume. The "tools" profile keeps
  # `docker compose up` from starting it; run it with
  # `docker compose run --rm brouter-segments`.
  brouter-segments:
    image: curlimages/curl:8.22.0
    profiles: ["tools"]
    # The image's default user can't write to a fresh volume.
    user: root
    entrypoint: ["/bin/sh", "/download-segments.sh"]
    volumes:
      - brouter-segments:/segments4
      - ./brouter/download-segments.sh:/download-segments.sh:ro

  # OpenTelemetry collector + Loki (logs), Tempo (traces), Prometheus
  # (metrics) and Grafana, all in one dev-only container.
  telemetry:
    image: grafana/otel-lgtm:0.33.1
    ports:
      - "127.0.0.1:3001:3000" # Grafana (Vite already uses 3000)
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    volumes:
      - telemetry-data:/data
      # Steer dashboards as code (the "Steer" folder in Grafana).
      - ./telemetry/grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/steer.yaml:ro
      - ./telemetry/grafana/dashboards:/otel-lgtm/steer-dashboards:ro
    healthcheck:
      # The image writes this file once every component is ready.
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db-data:
  telemetry-data:
